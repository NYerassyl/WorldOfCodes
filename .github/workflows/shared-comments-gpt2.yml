name: Shared Prisma FastAPI comments and two-account browser acceptance
on:
  push:
    branches: [feat/shared-comments-gpt2]
  pull_request:
    paths:
      - 'services/fastapi-backend/**'
      - 'services/learning-backend/src/problems/**'
      - 'services/learning-backend/prisma/**'
      - 'frontend/src/components/ProblemComments.tsx'
      - 'frontend/src/components/problem-comments.css'
      - 'frontend/src/lib/learning-api.ts'
      - 'frontend/src/pages/ServerPractice.tsx'
      - 'scripts/verify-comments-browser.py'
      - '.github/workflows/shared-comments-gpt2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: woc
          POSTGRES_PASSWORD: woc
          POSTGRES_DB: worldofcodes_shared_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U woc -d worldofcodes_shared_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://woc:woc@127.0.0.1:5432/worldofcodes_shared_test?schema=public
      FASTAPI_DATABASE_URL: postgresql+psycopg://woc:woc@127.0.0.1:5432/worldofcodes_shared_test
      SHARED_DATABASE_TEST_URL: postgresql://woc:woc@127.0.0.1:5432/worldofcodes_shared_test
      FASTAPI_INTERNAL_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install matching Linux optional binaries from inherited workspace versions
        run: node scripts/ensure-ci-native.mjs
      - name: Validate Prisma, apply migrations twice and seed
        run: |
          npm run db:validate
          npm run db:generate
          npm run db:migrate
          npm run db:migrate
          npm run db:seed
      - name: Install Python and browser dependencies
        run: |
          python -m pip install -r services/fastapi-backend/requirements.txt 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Apply shared profile Alembic view after Prisma tables
        working-directory: services/fastapi-backend
        run: python -m alembic upgrade head
      - name: Python API regression and real shared PostgreSQL checks
        run: python -m pytest -q services/fastapi-backend/tests
      - name: Node regression and frontend build
        run: |
          npm test
          npm run build
      - name: Two real accounts in Challenges and direct authorization checks
        run: python scripts/verify-comments-browser.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-comments-browser
          path: artifacts/
