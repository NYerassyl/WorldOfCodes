name: Python Trace Practice — execute all 50 exercises
on:
  push:
    branches:
      - feat/python-trace-content-gpt2
  pull_request:
    paths:
      - 'services/fastapi-backend/**'
      - '.github/workflows/python-trace-practice.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/fastapi-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute 50 Python snippets against saved answers, then API tests
        run: python -m pytest -q
      - name: Confirm trusted catalog and canonical API privacy
        run: python -m pytest -q tests/test_trace_practice.py tests/test_canonical_bridge.py
