name: Shared editor keyboard and strict Copy browser acceptance
on:
  push:
    branches: [feat/shared-editor-gpt2]
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'frontend/tests/editor-keys.test.mjs'
      - 'scripts/verify-editor-browser.py'
      - '.github/workflows/shared-editor-gpt2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: woc
          POSTGRES_PASSWORD: woc
          POSTGRES_DB: worldofcodes_editor_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U woc -d worldofcodes_editor_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://woc:woc@127.0.0.1:5432/worldofcodes_editor_test?schema=public
      FASTAPI_DATABASE_URL: postgresql+psycopg://woc:woc@127.0.0.1:5432/worldofcodes_editor_test
      SHARED_DATABASE_TEST_URL: postgresql://woc:woc@127.0.0.1:5432/worldofcodes_editor_test
      FASTAPI_INTERNAL_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/ensure-ci-native.mjs
      - name: Shared database migrations and seed
        run: |
          npm run db:generate
          npm run db:migrate
          npm run db:seed
      - name: Python and Chromium dependencies
        run: |
          python -m pip install -r services/fastapi-backend/requirements.txt 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Shared profile view
        working-directory: services/fastapi-backend
        run: python -m alembic upgrade head
      - name: Reused helper regression, full Node tests and build
        run: |
          npm test
          npm run build
      - name: Configure and mask a disposable shared JWT secret
        run: |
          JWT_VALUE="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$JWT_VALUE"
          echo "JWT_SECRET=$JWT_VALUE" >> "$GITHUB_ENV"
      - name: Real-page editor and Copy acceptance
        run: python scripts/verify-editor-browser.py
      - name: Upload keyboard screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-editor-browser
          path: artifacts/
