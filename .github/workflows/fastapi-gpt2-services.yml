name: FastAPI GPT 2 service contract

on:
  push:
    branches:
      - feat/fastapi-services-gpt2
      - feat/fastapi-postgresql
  pull_request:
    paths:
      - 'services/fastapi-backend/**'
      - '.github/workflows/fastapi-gpt2-services.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: woc
          POSTGRES_PASSWORD: woc
          POSTGRES_DB: worldofcodes_fastapi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U woc -d worldofcodes_fastapi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FASTAPI_DATABASE_URL: postgresql+psycopg://woc:woc@127.0.0.1:5432/worldofcodes_fastapi_test
      FASTAPI_TEST_DATABASE_URL: postgresql+psycopg://woc:woc@127.0.0.1:5432/worldofcodes_fastapi_test
    defaults:
      run:
        working-directory: services/fastapi-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all GPT 4 routers and GPT 2 service tests
        run: python -m pytest -q
      - name: Check migration drift
        run: python -m alembic check
