name: Learning backend validation

on:
  push:
    branches:
      - feat/learning-backend
  pull_request:
    paths:
      - 'services/learning-backend/**'
      - '.github/workflows/learning-backend-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/learning-backend
    env:
      DATABASE_URL: postgresql://worldofcodes:test@localhost:5432/worldofcodes?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install service dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate Prisma schema
        run: npx prisma validate --schema prisma/schema.prisma
      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma
      - name: Verify generated Battle model delegates
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { PrismaClient } from "@prisma/client";
            const prisma = new PrismaClient();
            for (const name of ["match", "matchPlayer", "rating", "friendBattle", "user", "problem"]) {
              assert.ok(prisma[name], "Missing generated Prisma delegate " + name);
              assert.equal(typeof prisma[name].findMany, "function");
            }
            await prisma.$disconnect();
          '
      - name: Run Learning backend regression tests
        run: npm test

  postgresql-docker-integration:
    name: Isolated PostgreSQL migrations, seed and Docker judge
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/learning-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: woc_ci
          POSTGRES_PASSWORD: woc_ci_only
          POSTGRES_DB: worldofcodes_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U woc_ci -d worldofcodes_integration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://woc_ci:woc_ci_only@127.0.0.1:5432/worldofcodes_integration_test?schema=public
      JUDGE_IMAGE: python:3.12-alpine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install service dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Prisma schema validation and client generation
        run: |
          npx prisma validate --schema prisma/schema.prisma
          npx prisma generate --schema prisma/schema.prisma
      - name: Deploy migration history to isolated test DB
        run: npx prisma migrate deploy --schema prisma/schema.prisma
      - name: Re-deploy migrations (must be no-op)
        run: npx prisma migrate deploy --schema prisma/schema.prisma
      - name: Seed course, problems, tests and copy exercises
        run: node prisma/seed.js
      - name: Reseed (must not create duplicates)
        run: node prisma/seed.js
      - name: Pull trusted Python Docker image for isolated judge
        run: docker pull python:3.12-alpine
      - name: Run real PostgreSQL + Docker Judge integration tests
        run: npm run test:integration
